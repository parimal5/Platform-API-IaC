
name: Validate Crossplane Configuration

on:
  pull_request:
    paths:
      - "crossplane/**"
      - ".github/workflows/validate-crossplane.yaml"
  push:
    branches:
      - main
    paths:
      - "crossplane/**"
      - ".github/workflows/validate-crossplane.yaml"

jobs:
  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Crossplane YAML
        run: yamllint -s crossplane/
