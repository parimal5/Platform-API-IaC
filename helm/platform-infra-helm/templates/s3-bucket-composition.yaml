apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: s3-bucket-composition
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: platform.parimal.com/v1alpha1
    kind: XS3Bucket
  mode: Pipeline

  pipeline:
    - step: patch-and-transform
      functionRef:
        name: upbound-function-patch-and-transform
      input:
        # apiVersion for function
        apiVersion: pt.fn.crossplane.io/v1beta1
        # Managed Resource
        kind: Resources
        # Reusable patches shared by all three resources
        patchSets:
          - name: common-region
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
          - name: common-namespace
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
        resources:
          #! S3 Bucket
          - name: bucket
            base:
              # apiVersion for MR
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              metadata:
                annotations:
                  # used for naming the bucket its default value can be completely removed and add a patch
                  crossplane.io/external-name: my-default-s3-bucket
                namespace: crossplane-system
              spec:
                forProvider:
                  region: us-east-1 # default values if user does not provide any

                  tags:
                    managed-by: crossplane
                providerConfigRef: # which aws creds it should used
                  name: cluster-provider-aws
                  kind: ClusterProviderConfig
            # Takes values from XR(auto created using XRD and Claim) and patch the MR
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucketName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Required

              - type: PatchSet
                patchSetName: common-region

              - type: PatchSet
                patchSetName: common-namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.tags
                toFieldPath: spec.forProvider.tags
                policy:
                  fromFieldPath: Optional
                  toFieldPath: MergeObjects
          #! 2. S3 Server-Side Encryption
          - name: bucket-encryption
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketServerSideEncryptionConfiguration
              metadata:
                namespace: crossplane-system
              spec:
                forProvider:
                  region: us-east-1
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: AES256
                providerConfigRef:
                  name: cluster-provider-aws
                  kind: ClusterProviderConfig
            patches:
              - type: PatchSet
                patchSetName: common-region
              - type: PatchSet
                patchSetName: common-namespace

          #! 3. S3 Public Access Block
          - name: bucket-public-access-block
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              metadata:
                namespace: crossplane-system
              spec:
                forProvider:
                  region: us-east-1
                  bucketSelector:
                    matchControllerRef: true
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                providerConfigRef:
                  name: cluster-provider-aws
                  kind: ClusterProviderConfig
            patches:
              - type: PatchSet
                patchSetName: common-region
              - type: PatchSet
                patchSetName: common-namespace

          #! 4. Bucket Versioning
          - name: bucket-versioning
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketVersioning
              metadata:
                namespace: crossplane-system
              spec:
                forProvider:
                  region: us-east-1
                  bucketSelector:
                    matchControllerRef: true
                  versioningConfiguration:
                    status: Disabled
                providerConfigRef:
                  name: cluster-provider-aws
                  kind: ClusterProviderConfig
            patches:
              - type: PatchSet
                patchSetName: common-region

              - type: PatchSet
                patchSetName: common-namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.versioningConfiguration.status
                toFieldPath: spec.forProvider.versioningConfiguration.status
                policy:
                  fromFieldPath: Required
