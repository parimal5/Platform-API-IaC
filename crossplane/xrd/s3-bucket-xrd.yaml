apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  # Crossplane requires the XRD's metadata.name to follow this exact convention: <plural>.<group>
  name: xs3buckets.platform.parimal.com
spec:
  group: platform.parimal.com
  names:
    kind: XS3Bucket
    plural: xs3buckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                bucketName:
                  type: string
                versioningConfiguration:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                        - Enabled
                        - Suspended
                        - Disabled
                bucketPolicy:
                  type: object
                  properties:
                    accessMode:
                      type: string
                      enum:
                        - ReadOnly
                        - ReadWrite
                  required:
                    - accessMode
                tags:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - region
                - bucketName
                - bucketPolicy
